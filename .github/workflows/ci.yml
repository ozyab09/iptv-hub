name: CI + Pages

# #318: setup-node@v5 and download-artifact@v8 still emit upstream Node
# DEP0040/DEP0169/DEP0005 warnings (including setup-node post-steps).
# See AGENTS.md, CI/CD, for the verified run and recheck procedure.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress выключен намеренно: push в main с новой версией запускает
# подпись APK и публикацию GitHub Release, и «отмена устаревшего прогона»
# оставила бы релиз полупустым. Прогоны одной ветки/тега просто ждут очереди.
concurrency:
  group: pages-${{ github.ref }}

jobs:
  # ============ Версия, тег и релиз ============
  #
  # Источник правды по версии — git-тег vX.Y.Z. На каждый push в main job
  # вычисляет следующий патч (максимальный тег + 1), штампует его в файлы
  # рабочей копии (package.json, android/version.properties,
  # public/version.json), ставит тег на проверяемый коммит и сообщает версию
  # дальше. Ручной bump версии больше не нужен.
  #
  # В main job ничего не коммитит: ruleset `main-protection` запрещает пуш в
  # main даже с GITHUB_TOKEN («Changes must be made through a pull request»),
  # поэтому версия живёт в теге, а на CI файлы штампуются перед сборкой.
  #
  # Почему тег создаётся здесь, а не отдельным workflow: пуш тега с
  # GITHUB_TOKEN не запускает новый прогон (защита GitHub от рекурсии),
  # поэтому тег и релиз обязаны быть в одном прогоне.
  release-check:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version || steps.from-tag.outputs.version || steps.manual.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code || steps.from-tag.outputs.version_code || steps.manual.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Push в main: считаем следующий патч, штампуем файлы и ставим тег на
      # проверяемый коммит. Логика покрыта tests/release-version.test.ts.
      - id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -f android/version.properties || {
            echo "::error::android/version.properties не найден — сборка APK упадёт"
            exit 1
          }
          node android/scripts/release-version.mjs --write --ensure-tag
      # Пуш тега v*: версия уже в теге, синхронизируем файлы без коммита
      # (тег неизменяем) и передаём версию дальше.
      - id: from-tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node android/scripts/release-version.mjs --write
      # Ручной запуск — пересборка текущей версии из package.json.
      - id: manual
        if: github.event_name == 'workflow_dispatch'
        run: node android/scripts/release-version.mjs

  build:
    # always() обязателен: на PR release-check пропущен, и без этого
    # обязательный чек build не запустился бы вовсе.
    if: always() && needs.release-check.result != 'failure'
    needs: [release-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore published Android metadata
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git fetch origin gh-pages; then
            git show FETCH_HEAD:.well-known/assetlinks.json > public/.well-known/assetlinks.json
          fi
      # version.json публикуем и обычным деплоем: release может не дойти
      # (например, упал визуальный тест), а версия на сайте нужна для
      # клиентского автообновления TWA.
      - name: Stamp version metadata
        if: needs.release-check.outputs.version != ''
        env:
          VERSION_NAME: ${{ needs.release-check.outputs.version }}
          VERSION_CODE: ${{ needs.release-check.outputs.version_code }}
        run: node android/scripts/release-version.mjs --write
      - run: npm run build
        env:
          APP_VERSION: ${{ needs.release-check.outputs.version }}
      # Одна web-сборка для visual, Android и Pages на любом событии.
      # Кладём НЕ github-pages, а артефакт для проверок и fallback:
      # в Pages её отправит deploy, но только если release не дошёл
      # (упал визуальный тест или сборка APK). Два одноимённых
      # github-pages в одном прогоне роняли deploy-pages (#250).
      # include-hidden-files обязателен: без него dot-файлы отбрасываются,
      # и public/.well-known/assetlinks.json не доезжает до живого сайта —
      # Android Asset Links отдают 404, TWA теряет fullscreen.
      - uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: dist
          include-hidden-files: true
          if-no-files-found: error

  visual:
    # always(): на PR release-check пропущен, а без этого условия зависимый
    # job тоже пропустился бы — так и случилось в первом прогоне.
    if: always() && needs.build.result == 'success'
    needs: [release-check, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox-media]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install browsers and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox --with-deps --only-shell
      # Каждый job получает свежую VM: браузеры кэшируются, apt-библиотеки — нет.
      - name: Install system dependencies for cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox
      # Firefox Web Audio требует работающий аудиовывод даже без физической карты.
      - name: Start virtual audio output for Firefox
        if: matrix.project == 'firefox-media'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=iptv_tests
          pactl set-default-sink iptv_tests
          pactl info
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  android:
    # always(): на PR release-check пропущен, а без этого условия зависимый
    # job тоже пропустился бы — так и случилось в первом прогоне.
    if: always() && needs.build.result == 'success'
    needs: [release-check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Node нужен только скриптам упаковки и проверки, без npm-зависимостей.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist
      - name: Stamp Android version
        if: needs.release-check.outputs.version != ''
        env:
          VERSION_NAME: ${{ needs.release-check.outputs.version }}
          VERSION_CODE: ${{ needs.release-check.outputs.version_code }}
        run: node android/scripts/release-version.mjs --write
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Проверенный dist зашивается в APK: без повторной web-сборки.
      - run: node android/scripts/bundle-web.mjs
      - run: gradle -p android/app clean assembleRelease compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Проверить, что ассеты попали в APK
        run: |
          set -euo pipefail
          unzip -l android/app/build/outputs/apk/release/*-unsigned.apk | grep -q "assets/www/index.html"
          echo "assets/www/index.html на месте"

      - name: Verify signing and Asset Links with a temporary key
        run: |
          node android/scripts/test-assetlinks.mjs
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 android/app/build/outputs/apk/release/*-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test-signing.jks" --ks-key-alias test --ks-pass pass:test-password --key-pass pass:test-password --out "$RUNNER_TEMP/test.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$RUNNER_TEMP/test.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

  release:
    # Новая версия выходит на каждый push в main (release-check уже
    # поставил тег), а также на тег v* и ручной запуск.
    # Гарда «релиз уже есть» больше нет — версия всегда новая.
    # Проверка ref обязательна: на PR release-check пропущен, и без неё
    # релиз собирался бы на каждый pull_request.
    if: >-
      always()
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && needs.build.result == 'success'
      && needs.visual.result == 'success'
      && needs.android.result == 'success'
    needs: [release-check, build, visual, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64" && test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/android-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 unsigned/*-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out iptv-hub.apk aligned.apk
          "$tools/apksigner" verify --verbose iptv-hub.apk
          node android/scripts/gen-assetlinks.mjs --keystore "$keystore" --alias "$ANDROID_KEY_ALIAS" --output public/.well-known/assetlinks.json
      - name: Prepare release metadata
        env:
          VERSION_NAME: ${{ needs.release-check.outputs.version }}
          VERSION_CODE: ${{ needs.release-check.outputs.version_code }}
        run: |
          set -euo pipefail
          node android/scripts/release-version.mjs --write
          cp public/version.json dist/version.json
          cp public/.well-known/assetlinks.json dist/.well-known/assetlinks.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-signed
          path: iptv-hub.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Тег уже создан release-check на этом же коммите.
          gh release create "$tag" --title "IPTV Hub $tag" --generate-notes iptv-hub.apk \
            || gh release upload "$tag" iptv-hub.apk --clobber

      - name: Save Android metadata for future Pages builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/android-metadata"
          cd "$RUNNER_TEMP/android-metadata"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          if git fetch origin gh-pages; then
            git checkout -b gh-pages FETCH_HEAD
          else
            git checkout -b gh-pages
          fi
          mkdir -p .well-known
          cp "$GITHUB_WORKSPACE/public/version.json" version.json
          cp "$GITHUB_WORKSPACE/public/.well-known/assetlinks.json" .well-known/assetlinks.json
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add version.json .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish Android release metadata'
            git push origin HEAD:gh-pages
          fi

      # ПОСЛЕДНИЙ шаг job'ы — это контракт для deploy (#250): deploy по
      # needs.release.result решает, брать этот артефакт или запасную
      # сборку из build. Если бы github-pages клали раньше шагов, которые
      # могут упасть (публикация Release, push metadata), упавший release
      # оставлял бы артефест в прогоне и deploy спотыкался бы о два
      # одноимённых. Провалился job ⇒ артефакта нет ⇒ срабатывает fallback.
      # include-hidden-files — как и в build: релизный деплой обязан
      # опубликовать .well-known/assetlinks.json с отпечатком keystore.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: always() && needs.build.result == 'success' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || needs.release.result == 'success')
    needs: [build, release]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fallback (#250): release не дошёл (упал визуальный тест или сборка
      # APK) — его github-pages в прогоне нет, поэтому в Pages уходит
      # сборка из build: иначе на сайте застрянет старая версия и старый
      # version.json для автообновления TWA. При успешном release эти два
      # шага пропускаются: артефакт github-pages уже положила release,
      # второй с тем же именем сломал бы deploy-pages.
      - name: Pack build artifact for Pages
        if: needs.release.result != 'success'
        uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist
      - name: Upload Pages artifact
        if: needs.release.result != 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
