plugins { id 'com.android.application' version '8.6.1' }
def versionProps = new Properties()
rootProject.file('../version.properties').withInputStream { versionProps.load(it) }
android {
    namespace 'io.github.ozyab09.iptvhub'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ozyab09.iptvhub'
        minSdk 24
        targetSdk 35
        versionName versionProps.getProperty('versionName')
        versionCode versionProps.getProperty('versionCode').toInteger()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}
// Kotlin stdlib тянется транзитивно из androidx (webkit/appcompat): старые
// kotlin-stdlib-jdk7/jdk8 дублируют классы уже из kotlin-stdlib. Выравниваем
// версии, иначе checkReleaseDuplicateClasses валит сборку.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    // AppCompatActivity: тема LauncherTheme наследует DeviceDefault, но материал
    // для WebView-активити нужен для корректного edge-to-edge и диалогов.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WindowCompat/WindowInsetsControllerCompat (edge-to-edge) и insets.
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader: локальный https-origin для зашитых в APK ассетов.
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
