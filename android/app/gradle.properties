# Gradle properties for the TWA/Bubblewrap build of IPTV Hub.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX / Kotlin.
android.useAndroidX=true
kotlin.code.style=official

# Build variant.
# BuildConfig.VERSION_NAME / VERSION_CODE берутся из version.properties, либо
# задаётся в CI Variables (VERSION_CODE / VERSION_NAME).
