# Android — TWA (Bubblewrap) APK сборка и публикация
#
# Pipeline запускается в GitLab командой переменных или тегом v*.
# - Android SDK: cimg/android:2026.08-node (JDK 17/21 + Android SDK 35)
# - AGP 8.7, Gradle 8.7 (Gradle Wrapper в android/app/)
# - Подпись: keystore из переменных CI (ANDROID_KEYSTORE_B64 и т.д.)
#
# На этапах:
#   1. gradle wrapper validation + assembleRelease
#   2. assetlinks.json generation (placeholder→реальный SHA-256)
#   3. update public/.well-known/assetlinks.json и смерджить в Pages
#   4. загрузка APK в Artifact + Package Registry (tag v*)
#   5. publish version.json на Pages для клиентского автообновления

stages:
  - validate
  - build
  - assetlinks
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
  ANDROID_ARCH: "arm64-v8a"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_SDK_API: "35"
  ANDROID_NDK: "26.1.10909125"

# Кэш Gradle + wrapper для ускорения pipeline.
cache:
  key: "${CI_JOB_NAME}"
  paths:
    - android/app/build/cache
    - android/app/gradle/wrapper

# JDK 17 + Android SDK (обязательны для AGP 8.7 + compileSdk 35).
.setup-android:
  image: cimg/android:2026.08-node
  before_script:
    - echo "Java: $(java -version 2>&1 | head -n 1)"
    - echo "Gradle: $(./gradlew -version 2>&1 | head -n 2)"
    - export ANDROID_HOME=$HOME/android-sdk
    - |
      echo y |
      $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
        "platform-tools" "platforms;android-$ANDROID_SDK_API" \
        "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" \
        "extras;google;m2repository" "extras;android;m2repository"
    - echo "ANDROID_HOME=$ANDROID_HOME" >> "$CI_ENVIRONMENT_VARIABLES" || true
    - $ANDROID_HOME/platform-tools/adb devices

# Проверка wrapper + компиляция модуля (без keystore).
validate:
  stage: validate
  extends: .setup-android
  script:
    - ./gradlew -p android/app wrapper
    - ./gradlew -p android/app compileDebugAndroidTestJavaWithJavac
    - ./gradlew -p android/app assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

# Сборка релиза (без подписи, в check включается keystore).
build:
  stage: build
  extends: .setup-android
  script:
    - ./gradlew -p android/app clean
    - ./gradlew -p android/app assembleRelease
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/app-release-unsigned.apk
    expire_in: 1 week

# Генерация assetlinks.json и синхронизация с Pages.
assetlinks:
  stage: assetlinks
  extends: .setup-android
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG
  script:
    - node android/scripts/gen-assetlinks.mjs \
        --keystore android/app/keystore.jks \
        --alias "$ANDROID_KEY_ALIAS" \
        --password "$ANDROID_KEYSTORE_PASSWORD" \
        --output android/app/src/main/assets/assetlinks.json
    # placeholder → актуальный SHA-256 для public/.well-known/assetlinks.json
    - cp android/app/src/main/assets/assetlinks.json public/.well-known/assetlinks.json
    - git config user.email "ci@iptv-hub"
    - git config user.name "CI"
    - git add public/.well-known/assetlinks.json
    - git commit -m "chore: update assetlinks.json (SHA-256 from keystore) [skip ci]" || true
    - git push origin HEAD:gh-pages || echo "push skipped"
  artifacts:
    paths:
      - public/.well-known/assetlinks.json
    expire_in: 1 week

# Публикация релиза.
publish:
  stage: publish
  extends: .setup-android
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      APk=$(ls android/app/build/outputs/apk/release/app-release-unsigned.apk)
      cp "$APk" app-release.apk
    # подпись через переменные CI
    - echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/keystore.jks
    - chmod 600 android/app/keystore.jks
    - jarsigner -sigalg SHA256withRSA -digestalg SHA256 \
        -keystore android/app/keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" \
        -keypass "$ANDROID_KEY_PASSWORD" app-release.apk "$ANDROID_KEY_ALIAS"
    - zipalign -v -p 4 app-release.apk app-release-signed.apk
    # версии из CI Variables (если не заданы — 1000 + tag)
    - export VERSION_CODE=${VERSION_CODE:-1000}
    - export VERSION_NAME=${VERSION_NAME:-${CI_COMMIT_TAG#v}}
    - echo "{ \"versionCode\": \"$VERSION_CODE\", \"versionName\": \"$VERSION_NAME\" }" \
        > android/app/src/main/assets/version.json
    - echo "{ \"versionCode\": \"$VERSION_CODE\", \"versionName\": \"$VERSION_NAME\" }" \
        > version.json  # public/ для Pages автообновления
    - git add version.json
    - git commit -m "chore: version $VERSION_NAME [skip ci]" || true
    - git push origin HEAD:gh-pages || echo "push skipped"
    # APK в Artifact
    - |
      mkdir -p dist/android
      cp app-release-signed.apk dist/android/iptv-hub-$VERSION_CODE.apk
    artifacts:
      paths:
        - dist/android/
        - version.json
      expire_in: 1 year
    # Package Registry (APK)
    - |
      if [ -n "$CI_JOB_TOKEN" ]; then
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data "description=IPTV Hub $VERSION_NAME ($CI_COMMIT_TAG) APK" \
          --data "maven_package_format=apk" \
          --form "file=@dist/android/iptv-hub-$VERSION_CODE.apk" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/"
      fi
    # Releases (legacy, если понадобится инициализация)
    - |
      if [ -n "$GITHUB_TOKEN" ]; then
        gh release upload "$CI_COMMIT_TAG" dist/android/iptv-hub-$VERSION_CODE.apk \
          --clobber
      fi
  environment:
    name: production
    url: https://ozyab09.github.io/iptv-hub/
